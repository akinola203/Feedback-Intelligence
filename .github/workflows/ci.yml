name: Django & Pytest CI/CD Pipeline

on:
  push:
    branches: [ main, master, phase-3b-step2 ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Spin up a live PostgreSQL 16 service container for true composite constraint testing
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_feedback_platform
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: TestPassword123!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: feedback_platform/requirements.txt

      - name: Install System Dependencies & Python Packages
        run: |
          python -m pip install --upgrade pip
          cd feedback_platform
          pip install -r requirements.txt
          pip install pytest pytest-django

      - name: Verify Django Configuration & Migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: ci-test-secret-key-entropy-12345
          DJANGO_DEBUG: "False"
          DB_NAME: test_feedback_platform
          DB_USER: postgres_user
          DB_PASSWORD: TestPassword123!
          DB_HOST: localhost
          DB_PORT: 5432
          DATABASE_URL: postgresql://postgres_user:TestPassword123!@localhost:5432/test_feedback_platform
        run: |
          cd feedback_platform
          python manage.py check
          python manage.py migrate --no-input

      - name: Run Test Suite with PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: ci-test-secret-key-entropy-12345
          DJANGO_DEBUG: "False"
          DB_NAME: test_feedback_platform
          DB_USER: postgres_user
          DB_PASSWORD: TestPassword123!
          DB_HOST: localhost
          DB_PORT: 5432
          DATABASE_URL: postgresql://postgres_user:TestPassword123!@localhost:5432/test_feedback_platform
        run: |
          cd feedback_platform
          python manage.py test --verbosity=2

